[project]
name = "snakeboot"
version = "0.11.1"
description = "Spring Boot ergonomics for hexagonal Python: @transactional, application events, a component scan, typed configuration with profiles, singleton REST controllers on FastAPI and Spring Data repositories on SQLAlchemy, wired by wireup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wouter Deketelaere", email = "wouter.deketelaere@kdg.be" }
]
requires-python = ">=3.13"
dependencies = [
    "wireup>=2.13.1",
]
keywords = ["spring-boot", "hexagonal-architecture", "ddd", "spring-data", "fastapi", "sqlalchemy", "wireup", "dependency-injection", "transactional"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KdG-OCDI/snakeboot"
Repository = "https://github.com/KdG-OCDI/snakeboot"
Issues = "https://github.com/KdG-OCDI/snakeboot/issues"
Changelog = "https://github.com/KdG-OCDI/snakeboot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Typed configuration from application.toml, one profile and the environment (snakeboot.configuration).
configuration = ["pydantic-settings>=2.16.0,<3"]
# Publishes the REST controllers and advices of snakeboot.rest on FastAPI, served by uvicorn (snakeboot.fastapi_web).
web = ["pydantic-settings>=2.16.0,<3", "fastapi>=0.162.2", "uvicorn>=0.54.0"]
# Entities, repositories and migrations of snakeboot.data on SQLAlchemy, Alembic and PostgreSQL (snakeboot.sqlalchemy_data).
data = ["pydantic-settings>=2.16.0,<3", "sqlalchemy>=2.1.8", "alembic>=1.20.1", "psycopg[binary]>=3.3.8"]
# Similarity search on pgvector columns: a Vector field of snakeboot.data (with the extra data).
vector = ["pgvector>=0.5.1"]
# A Cache of snakeboot.cache in the Redis of [cache] (snakeboot.redis_cache).
cache = ["pydantic-settings>=2.16.0,<3", "redis>=8.1.0"]
# Accept the JWT access tokens of an OAuth2 authorization server, such as Keycloak (snakeboot.oauth2).
oauth2 = ["pydantic-settings>=2.16.0,<3", "pyjwt[crypto]>=2.10.1"]
# @rabbit_listener methods and a RabbitTemplate on RabbitMQ, through pika (snakeboot.rabbitmq).
rabbitmq = ["pydantic-settings>=2.16.0,<3", "pika>=1.3.2"]
# Tests of the whole application: @application_test on pytest, and a client of the REST API like TestRestTemplate.
testing = ["httpx2>=2.16.0", "pytest>=8.4"]
# A test on PostgreSQL in Docker, built by the application's migrations: @application_test(database=PostgreSQLContainer()).
testcontainers = ["testcontainers>=4.15"]

# pytest loads snakeboot's plugin by itself: an @application_test starts its application and gets what it asks for.
[project.entry-points.pytest11]
snakeboot = "snakeboot.pytest_testing.pytest_plugin"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pgvector>=0.5.1",
    "pika>=1.3.2",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.0,<3",
    "pyjwt[crypto]>=2.10.1",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.8",
    "testcontainers>=4.15",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytester runs the plugin in projects of its own (tests/boot/test_pytest_plugin.py).
addopts = "-ra --strict-markers -p pytester"
# The tests are a package of their own (tests.rest.sample_controllers, tests.application.sample_service).
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Architecture contracts (run with `uv run lint-imports`, also part of pytest).
# What an application imports knows no framework; each binding knows one.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "snakeboot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "what an application imports knows no web, persistence or cache framework"
type = "forbidden"
source_modules = ["snakeboot.transaction", "snakeboot.component_scan", "snakeboot.openapi", "snakeboot.testing", "snakeboot.cache", "snakeboot.security", "snakeboot.tracing", "snakeboot.actuator", "snakeboot.events", "snakeboot.configuration", "snakeboot.rest", "snakeboot.data", "snakeboot.command_line", "snakeboot.lifecycle", "snakeboot.scheduling", "snakeboot.oauth2", "snakeboot.rabbitmq", "snakeboot.event_publication", "snakeboot.scheduler_lock", "snakeboot.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "pgvector",
    "redis",
    "snakeboot.fastapi_web",
    "snakeboot.sqlalchemy_data",
    "snakeboot.redis_cache",
    "snakeboot.pytest_testing",
    "snakeboot.boot",
]

[[tool.importlinter.contracts]]
name = "transaction, component_scan, openapi, cache, security, tracing and testing are standard library only"
type = "forbidden"
source_modules = ["snakeboot.transaction", "snakeboot.component_scan", "snakeboot.openapi", "snakeboot.cache", "snakeboot.security", "snakeboot.tracing", "snakeboot.testing"]
forbidden_modules = [
    "pytest",
    "wireup",
    "pydantic",
    "pydantic_settings",
    "pydantic_core",
    "pika",
    "jwt",
    "snakeboot.configuration",
    "snakeboot.events",
    "snakeboot.rest",
    "snakeboot.data",
    "snakeboot.command_line",
    "snakeboot.lifecycle",
    "snakeboot.scheduling",
    "snakeboot.rabbitmq",
    "snakeboot.oauth2",
    "snakeboot.actuator",
    "snakeboot.event_publication",
    "snakeboot.scheduler_lock",
    "snakeboot.application",
]

[[tool.importlinter.contracts]]
name = "events, rest, data and command_line know wireup and their own concern, and no other library of snakeboot"
type = "forbidden"
source_modules = ["snakeboot.events", "snakeboot.rest", "snakeboot.data", "snakeboot.command_line"]
