[project]
name = "snakeboot"
version = "0.6.0"
description = "Spring Boot ergonomics for hexagonal Python: @transactional, application events, a component scan, typed configuration with profiles and singleton REST controllers on Django Ninja, wired by wireup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wouter Deketelaere", email = "wouter.deketelaere@kdg.be" }
]
requires-python = ">=3.13"
dependencies = [
    "wireup>=2.12.0",
]
keywords = ["spring-boot", "hexagonal-architecture", "ddd", "django", "django-ninja", "wireup", "dependency-injection", "transactional"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KdG-OCDI/snakeboot"
Repository = "https://github.com/KdG-OCDI/snakeboot"
Issues = "https://github.com/KdG-OCDI/snakeboot/issues"
Changelog = "https://github.com/KdG-OCDI/snakeboot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# DjangoAtomicTransactionManager (snakeboot.django).
django = ["django>=6.1.1"]
# Publishes the REST controllers and advices of snakeboot.rest on Django Ninja (snakeboot.django_ninja).
ninja = ["django>=6.1.1", "django-ninja>=1.7.1"]
# Typed configuration from application.toml, one profile and the environment (snakeboot.configuration).
configuration = ["pydantic-settings>=2.16.0,<3"]
# Accept the JWT access tokens of an OAuth2 authorization server, such as Keycloak (snakeboot.oauth2).
oauth2 = ["django>=6.1.1", "django-ninja>=1.7.1", "pydantic-settings>=2.16.0,<3", "pyjwt[crypto]>=2.10.1"]
# @rabbit_listener methods and a RabbitTemplate on RabbitMQ, through pika (snakeboot.rabbitmq).
rabbitmq = ["pydantic-settings>=2.16.0,<3", "pika>=1.3.2"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django>=6.1.1",
    "django-ninja>=1.7.1",
    "django-stubs>=6.1.2",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pika>=1.3.2",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16.0,<3",
    "pyjwt[crypto]>=2.10.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "tests.django_settings"
# The tests are a package of their own (tests.django_settings, tests.rest.sample_controllers).
pythonpath = ["."]
django_find_project = false

# ---------------------------------------------------------------------------
# Architecture contracts (run with `uv run lint-imports`, also part of pytest).
# Each library stays as small as its purpose: the core knows no framework.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "snakeboot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "transaction knows no framework and no other part of snakeboot"
type = "forbidden"
source_modules = ["snakeboot.transaction"]
forbidden_modules = [
    "snakeboot.rabbitmq",
    "pika",
    "snakeboot.scheduling",
    "snakeboot.lifecycle",
    "django",
    "ninja",
    "wireup",
    "pydantic",
    "pydantic_settings",
    "snakeboot.configuration",
    "snakeboot.component_scan",
    "snakeboot.events",
    "snakeboot.rest",
    "snakeboot.django",
    "snakeboot.django_application",
    "snakeboot.testing",
    "snakeboot.oauth2",
    "jwt",
    "snakeboot.django_ninja",
    "snakeboot.command_line",
    "snakeboot.boot",
]

[[tool.importlinter.contracts]]
name = "component_scan is standard library only, so settings can use it before Django starts"
