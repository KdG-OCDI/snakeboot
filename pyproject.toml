# ---------------------------------------------------------------------------
# Code contracts: the Clean Code rules in AGENTS.md, enforced by Ruff and mypy.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A",
    "C4", "SIM", "RET", "PIE", "PERF",
    "C90", "PL", "FBT", "ARG", "ERA", "T20", "BLE", "DJ", "PT",
    "D101", "D102", "D103", "D106",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 8
max-returns = 4
max-statements = 25

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["typing.override"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLR0913", "PLR0917", "ARG", "FBT"]
"**/models.py" = ["D106", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
enable_error_code = ["explicit-override", "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# pika has annotations, but no py.typed marker.
module = ["pika", "pika.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asgiref.testing.ApplicationCommunicator, which drives an ASGI application in the lifespan tests, has no annotations.
module = ["tests.lifecycle.test_lifecycle_asgi_application"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "tests.django_settings"
