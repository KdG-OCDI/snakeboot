# Every push and pull request runs the same checks as the pre-commit hook,
# on every Python version the classifiers in pyproject.toml promise.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install (exactly the versions in uv.lock)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Format
        run: uv run ruff format --check

      - name: Lint (Clean Code rules)
        run: uv run ruff check

      - name: Types (mypy strict)
        run: uv run mypy

      - name: Tests and import contracts
        run: uv run pytest
